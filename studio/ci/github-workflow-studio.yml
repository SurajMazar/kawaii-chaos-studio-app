# GitHub Actions workflow for the Studio. To enable it, move this file to .github/workflows/studio.yml:
#   mkdir -p .github/workflows && git mv studio/ci/github-workflow-studio.yml .github/workflows/studio.yml
# Pushing workflow files needs a GitHub token with the `workflow` scope:  gh auth refresh -s workflow
name: Kawaii Chaos Studio

on:
  push:
    branches: [main]
    paths: ['studio/**', 'scripts/**', 'Dockerfile', 'docker-compose.yml', '.github/workflows/studio.yml']
  pull_request:
    paths: ['studio/**', 'scripts/**', 'Dockerfile', 'docker-compose.yml', '.github/workflows/studio.yml']

permissions:
  contents: read

concurrency:
  group: studio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: studio } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13', cache: pip, cache-dependency-path: studio/requirements*.txt }
      - name: System packages (ffmpeg for the render tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Security lint (bandit)
        run: bandit -q -r api security storage config.py server.py
      - name: Dependency audit (pip-audit)
        run: pip-audit -r requirements.txt --progress-spinner off
      - name: Tests (pytest, incl. moto S3)
        run: python -m pytest tests -q -p no:warnings
        env: { STUDIO_SCRIPT_PYTHON: python }

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: studio/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: studio/web/package-lock.json }
      - run: npm ci --no-fund
      - name: Lint (eslint)
        run: npx eslint src
      - name: Type-check + build
        run: npm run build
      - name: npm audit (high and above)
        run: npm audit --audit-level=high --omit=dev

  docker:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with: { context: ., push: false, load: true, tags: 'kawaii-chaos-studio:ci', cache-from: type=gha, cache-to: 'type=gha,mode=max' }
      - name: Smoke test (health, auth required, security headers)
        run: |
          docker run -d --name kcs -p 8770:8770 -e STUDIO_SECRET_KEY=ci-only-secret kawaii-chaos-studio:ci
          for i in $(seq 1 30); do curl -fsS localhost:8770/api/health && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8770/api/library)" = 401
          curl -sI localhost:8770/ | grep -qi "content-security-policy"
          docker logs kcs | grep -q "FIRST-RUN SETUP"
          docker rm -f kcs
