name: Release (Mac app)

# Push a version tag to publish:   git tag v0.1.0 && git push origin v0.1.0
# (or run it by hand: Actions → Release (Mac app) → Run workflow → version)
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version: { description: 'Version, e.g. 0.1.0', required: true }

permissions:
  contents: write          # create the release and upload the .dmg

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  mac:
    runs-on: macos-15       # Apple Silicon
    timeout-minutes: 60
    env:
      RAW_VERSION: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - name: Version
        run: |
          V="${RAW_VERSION#v}"
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]] || { echo "bad version: $RAW_VERSION"; exit 1; }
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: npm, cache-dependency-path: studio/web/package-lock.json }
      - name: Build the web app
        working-directory: studio/web
        run: npm ci --no-fund && npm audit --audit-level=moderate && npm run build
      - uses: actions/setup-python@v6
        with: { python-version: '3.13', cache: pip, cache-dependency-path: '**/requirements*.txt' }
      - name: Python packages
        run: python -m pip install -r studio/requirements.txt -r desktop/requirements.txt
      - name: Tests
        timeout-minutes: 20
        run: |
          python -m pip install pytest httpx 'moto[s3]'
          command -v ffmpeg >/dev/null || brew install ffmpeg      # the render tests use ffmpeg + ffprobe
          cd studio && python -m pytest -q -p no:warnings tests
      - name: Build the app
        run: |
          python desktop/make_icon.py
          APP_VERSION="$VERSION" pyinstaller --noconfirm --distpath desktop/dist --workpath desktop/build/pyi desktop/kawaii.spec
      - name: Self-test the packaged app (bundled ffmpeg)
        run: KCS_BUNDLED_FFMPEG=1 "desktop/dist/Kawaii Chaos Studio.app/Contents/MacOS/Kawaii Chaos Studio" --selftest
      - name: Disk image
        run: |
          mkdir -p dmg && cp -R "desktop/dist/Kawaii Chaos Studio.app" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Kawaii Chaos Studio" -srcfolder dmg -ov -format UDZO "Kawaii-Chaos-Studio-$VERSION-mac-arm64.dmg"
          shasum -a 256 Kawaii-Chaos-Studio-*.dmg > SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Kawaii Chaos Studio $TAG" --generate-notes
          gh release upload "$TAG" Kawaii-Chaos-Studio-*.dmg SHA256SUMS.txt --clobber
