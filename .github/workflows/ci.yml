name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults: { run: { working-directory: studio } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.13', cache: pip, cache-dependency-path: studio/requirements*.txt }
      - name: System packages (ffmpeg for the render tests)
        timeout-minutes: 8
        run: |
          # wait for the runner's own apt jobs instead of hanging on the lock; retry slow mirrors
          sudo apt-get -o DPkg::Lock::Timeout=300 -o Acquire::Retries=3 update
          sudo apt-get -o DPkg::Lock::Timeout=300 -o Acquire::Retries=3 install -y --no-install-recommends ffmpeg
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Security lint (bandit)
        run: bandit -q -r api security storage config.py server.py
      - name: Dependency audit (pip-audit)
        run: pip-audit -r requirements.txt --progress-spinner off
      - name: Tests (pytest, incl. moto S3)
        run: python -m pytest tests -q -p no:warnings
        env: { STUDIO_SCRIPT_PYTHON: python }

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults: { run: { working-directory: studio/web } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: npm, cache-dependency-path: studio/web/package-lock.json }
      - run: npm ci --no-fund
      - name: Lint (eslint)
        run: npx eslint src
      - name: Type-check + build
        run: npm run build
      - name: npm audit (moderate and above)
        run: npm audit --audit-level=moderate

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with: { context: ., push: false, load: true, tags: 'kawaii-chaos-studio:ci', cache-from: type=gha, cache-to: 'type=gha,mode=max' }
      - name: Smoke test (health, auth required, security headers)
        run: |
          docker run -d --name kcs -p 8770:8770 -e STUDIO_SECRET_KEY=ci-only-secret kawaii-chaos-studio:ci
          for i in $(seq 1 30); do curl -fsS localhost:8770/api/health && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8770/api/library)" = 401
          curl -sI localhost:8770/ | grep -qi "content-security-policy"
          docker logs kcs | grep -q "FIRST-RUN SETUP"
          docker rm -f kcs
